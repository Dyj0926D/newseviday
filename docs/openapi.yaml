openapi: 3.1.0
info:
  title: NewsEviday Public API
  version: 0.1.0
  description: Public status plus gated profile enhancement and evidence-grounded RAG endpoints.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Worker is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/status:
    get:
      operationId: getStatus
      responses:
        '200':
          description: Public content and AI capability status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/runtime-config:
    get:
      operationId: getRuntimeConfig
      responses:
        '200':
          description: Public switches and limits; never includes secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigResponse'
  /api/profile/enhance:
    post:
      operationId: enhanceProfile
      description: Returns a reviewable profile suggestion. It never saves the profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileEnhanceRequest' }
      responses:
        '200':
          description: Structured profile suggestion.
          content:
            application/json:
              schema: { type: object }
        '503': { description: AI is disabled or unavailable. }
  /api/ask:
    post:
      operationId: askWithEvidence
      description: Returns SSE for an answer or JSON for an evidence-threshold refusal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }
      responses:
        '200':
          description: SSE answer or structured refusal.
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema: { type: object }
        '503': { description: RAG is disabled or incomplete. }
components:
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [requestId, generatedAt, version, durationMs]
      properties:
        requestId: { type: string }
        generatedAt: { type: string, format: date-time }
        version: { type: string }
        durationMs: { type: integer, minimum: 0 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok, data, meta]
      properties:
        ok: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [service, status]
          properties:
            service: { const: newseviday-api }
            status: { const: ok }
        meta: { $ref: '#/components/schemas/Meta' }
    StatusResponse:
      type: object
      additionalProperties: false
      required: [ok, data, meta]
      properties:
        ok: { const: true }
        data:
          type: object
          required: [product, mode, content, ai, rag]
          properties:
            product: { const: NewsEviday }
            mode: { enum: [archive, warmup, interview] }
            content:
              type: object
              required: [state, updatedAt, sourceCount, snapshotId]
              properties:
                state: { enum: [empty, ready, stale] }
                updatedAt: { type: [string, 'null'], format: date-time }
                sourceCount: { type: integer, minimum: 0 }
                snapshotId: { type: [string, 'null'] }
            ai:
              type: object
              required: [state, provider, model]
              properties:
                state: { enum: [available, saving-mode, static-only, rate-limited, budget-paused] }
                provider: { enum: [deepseek, null] }
                model: { type: [string, 'null'] }
            rag:
              type: object
              required: [state, retrievalMode, corpusSnapshotId]
              properties:
                state: { enum: [available, saving-mode, static-only, rate-limited, budget-paused] }
                retrievalMode: { enum: [chunk_dense, article_dense, null] }
                corpusSnapshotId: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/Meta' }
    RuntimeConfigResponse:
      type: object
      additionalProperties: false
      required: [ok, data, meta]
      properties:
        ok: { const: true }
        data:
          type: object
          required: [schemaVersion, mode, features, limits]
          properties:
            schemaVersion: { const: 1.0.0 }
            mode: { enum: [archive, warmup, interview] }
            features:
              type: object
              required: [ingestion, aiSummary, rag, trendBrief]
              properties:
                ingestion: { type: boolean }
                aiSummary: { type: boolean }
                rag: { type: boolean }
                trendBrief: { type: boolean }
            limits:
              type: object
              required: [dailyQuestionsPerIp, monthlyBudgetCny, hardBudgetCny, requestBodyBytes, upstreamTimeoutMs]
              properties:
                dailyQuestionsPerIp: { type: integer, minimum: 0, maximum: 100 }
                monthlyBudgetCny: { type: integer, minimum: 0, maximum: 50 }
                hardBudgetCny: { type: integer, minimum: 0, maximum: 50 }
                requestBodyBytes: { type: integer, minimum: 1024 }
                upstreamTimeoutMs: { type: integer, minimum: 1000 }
        meta: { $ref: '#/components/schemas/Meta' }
    ProfileEnhanceRequest:
      type: object
      additionalProperties: false
      required: [role, work, goal, description]
      properties:
        role: { type: string, maxLength: 80 }
        work: { type: string, maxLength: 200 }
        goal: { type: string, maxLength: 240 }
        description: { type: string, maxLength: 500 }
    AskRequest:
      type: object
      additionalProperties: false
      required: [question, range]
      properties:
        question: { type: string, minLength: 2, maxLength: 300 }
        range: { enum: [7d, 30d] }
        articleId: { type: string, maxLength: 120 }
