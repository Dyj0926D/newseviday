version: 1
sources:
  - id: arxiv-cs-ai
    name: arXiv cs.AI
    adapter: atom
    url: https://export.arxiv.org/api/query?search_query=cat:cs.AI&sortBy=submittedDate&sortOrder=descending&max_results=20
    language: en
    region: 全球
    enabled: true
    usage_scope: metadata_and_abstract
    max_items: 20
    note: 使用公开 API 的标题、作者和摘要，不转载论文全文

  - id: github-ai-ml
    name: GitHub Blog AI & ML
    adapter: rss
    url: https://github.blog/ai-and-ml/feed/
    language: en
    region: 北美
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 仅保留 Feed 元数据、短摘录和原文链接

  - id: databricks-blog
    name: Databricks Blog
    adapter: rss
    url: https://www.databricks.com/feed
    language: en
    region: 北美
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 重点筛选 Data Intelligence、Lakehouse 与 Agent 主题

  - id: dbt-labs-blog
    name: dbt Labs Blog
    adapter: rss
    url: https://www.getdbt.com/blog/rss.xml
    language: en
    region: 北美
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 重点筛选 Semantic Layer、Analytics Engineering 与 Agent 主题

  - id: aws-ml-blog
    name: AWS Machine Learning Blog
    adapter: rss
    url: https://aws.amazon.com/blogs/machine-learning/feed/
    language: en
    region: 北美
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 只处理公开 Feed，后续按主题配额控制云厂商占比

  - id: cloudflare-blog
    name: Cloudflare Blog
    adapter: rss
    url: https://blog.cloudflare.com/rss/
    language: en
    region: 北美
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 重点筛选 Workers AI、AI Gateway、Vectorize 与安全主题

  - id: huggingface-blog
    name: Hugging Face Blog
    adapter: rss
    url: https://huggingface.co/blog/feed.xml
    language: en
    region: 全球
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 兼容部分条目只提供 permalink GUID 的 Feed 结构

  - id: google-deepmind-blog
    name: Google DeepMind Blog
    adapter: rss
    url: https://deepmind.google/blog/rss.xml
    language: en
    region: 欧洲
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 重点筛选 Agent、模型能力、评测与安全研究
