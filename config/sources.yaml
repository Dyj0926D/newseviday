version: 1
sources:
  - id: arxiv-cs-ai
    name: arXiv cs.AI
    adapter: atom
    url: https://export.arxiv.org/api/query?search_query=cat:cs.AI&sortBy=submittedDate&sortOrder=descending&max_results=20
    language: en
    region: 全球
    enabled: true
    usage_scope: metadata_and_abstract
    max_items: 20
    note: 使用公开 API 的标题、作者和摘要，不转载论文全文

  - id: github-ai-ml
    name: GitHub Blog AI & ML
    adapter: rss
    url: https://github.blog/ai-and-ml/feed/
    language: en
    region: 北美
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 仅保留 Feed 元数据、短摘录和原文链接

  - id: databricks-blog
    name: Databricks Blog
    adapter: rss
    url: https://www.databricks.com/feed
    language: en
    region: 北美
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 重点筛选 Data Intelligence、Lakehouse 与 Agent 主题

  - id: dbt-labs-blog
    name: dbt Labs Blog
    adapter: rss
    url: https://www.getdbt.com/blog/rss.xml
    language: en
    region: 北美
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 重点筛选 Semantic Layer、Analytics Engineering 与 Agent 主题

  - id: openai-news
    name: OpenAI News
    adapter: rss
    url: https://openai.com/news/rss.xml
    language: en
    region: 北美
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 通用 AI 产品、模型、Agent、安全与开发者平台的一手信息

  - id: anthropic-news
    name: Anthropic Newsroom
    adapter: html
    url: https://www.anthropic.com/news
    language: en
    region: 北美
    enabled: true
    usage_scope: metadata_and_link
    max_items: 12
    include_url_patterns:
      - ^https://www\.anthropic\.com/news/[a-z0-9-]+$
    title_class_patterns:
      - __title(?:\s|$)
    note: 官方站无稳定 RSS，仅采集 Newsroom 文章链接和标题，不抓导航与营销页面

  - id: qwen-blog
    name: Qwen Blog
    adapter: rss
    url: https://qwenlm.github.io/blog/index.xml
    language: mixed
    region: 中国大陆
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 国内通用模型、Agent、开源模型和产品更新的一手信息

  - id: deepseek-updates
    name: DeepSeek API Updates
    adapter: html
    url: https://api-docs.deepseek.com/updates/
    language: mixed
    region: 中国大陆
    enabled: true
    usage_scope: metadata_and_link
    max_items: 12
    heading_tags:
      - h3
    note: 官方 API 更新与模型发布；按变更日志三级标题生成可追溯锚点链接

  - id: huggingface-blog
    name: Hugging Face Blog
    adapter: rss
    url: https://huggingface.co/blog/feed.xml
    language: en
    region: 全球
    enabled: true
    usage_scope: metadata_and_excerpt
    max_items: 12
    note: 兼容部分条目只提供 permalink GUID 的 Feed 结构
