name: Weekly trend brief

on:
  schedule:
    # Saturday 10:00 Asia/Shanghai. The evidence window closes at Saturday 09:00.
    - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      allow_model:
        description: 'Permit article enrichment and one DeepSeek weekly brief call'
        required: true
        type: boolean
        default: false
      force_generate:
        description: 'Regenerate the last complete weekly window outside Saturday'
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: weekly-trend-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_THINKING_ENABLED: ${{ vars.DEEPSEEK_THINKING_ENABLED || 'false' }}
      DEEPSEEK_INPUT_CNY_PER_MILLION: ${{ vars.DEEPSEEK_INPUT_CNY_PER_MILLION || '2' }}
      DEEPSEEK_OUTPUT_CNY_PER_MILLION: ${{ vars.DEEPSEEK_OUTPUT_CNY_PER_MILLION || '4' }}
      WEEKLY_BRIEF_ENABLED: ${{ vars.WEEKLY_BRIEF_ENABLED || 'true' }}
      WEEKLY_REFRESH_MAX_MODEL_CALLS: ${{ vars.WEEKLY_REFRESH_MAX_MODEL_CALLS || '5' }}
      WEEKLY_REFRESH_AUTO_MERGE: ${{ vars.WEEKLY_REFRESH_AUTO_MERGE || 'false' }}
      DAILY_REFRESH_MAX_MODEL_CALLS: ${{ vars.DAILY_REFRESH_MAX_MODEL_CALLS || '5' }}
      DAILY_REFRESH_MAX_MODEL_CALLS_PER_RUN: ${{ vars.DAILY_REFRESH_MAX_MODEL_CALLS_PER_RUN || '10' }}
      DAILY_REFRESH_ROLLOVER_CAP: ${{ vars.DAILY_REFRESH_ROLLOVER_CAP || '10' }}
      DAILY_REFRESH_ROLLOVER_SEED: ${{ vars.DAILY_REFRESH_ROLLOVER_SEED || '0' }}
    steps:
      - name: Resolve weekly policy
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "RUN_BRIEF=$WEEKLY_BRIEF_ENABLED" >> "$GITHUB_ENV"
            echo "ALLOW_MODEL=$WEEKLY_BRIEF_ENABLED" >> "$GITHUB_ENV"
            echo "BASE_MODEL_CALL_LIMIT=$DAILY_REFRESH_MAX_MODEL_CALLS" >> "$GITHUB_ENV"
            echo "MODEL_CALL_LIMIT=$DAILY_REFRESH_MAX_MODEL_CALLS_PER_RUN" >> "$GITHUB_ENV"
            echo "USE_ROLLOVER=true" >> "$GITHUB_ENV"
          else
            echo "RUN_BRIEF=true" >> "$GITHUB_ENV"
            echo "ALLOW_MODEL=${{ inputs.allow_model }}" >> "$GITHUB_ENV"
            echo "BASE_MODEL_CALL_LIMIT=$WEEKLY_REFRESH_MAX_MODEL_CALLS" >> "$GITHUB_ENV"
            echo "MODEL_CALL_LIMIT=$WEEKLY_REFRESH_MAX_MODEL_CALLS" >> "$GITHUB_ENV"
            echo "USE_ROLLOVER=false" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
        if: env.RUN_BRIEF == 'true'
      - uses: actions/setup-python@v7
        if: env.RUN_BRIEF == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        if: env.RUN_BRIEF == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - if: env.RUN_BRIEF == 'true'
        run: python -m pip install uv
      - if: env.RUN_BRIEF == 'true'
        run: python -m uv sync --project pipeline --frozen
      - name: Restore cumulative AI cache
        if: env.RUN_BRIEF == 'true'
        uses: actions/cache@v5
        with:
          path: |
            data/runtime/ai-cache
            data/runtime/ai-budget
          key: ai-cache-${{ runner.os }}-${{ env.DEEPSEEK_MODEL }}-${{ hashFiles('pipeline/src/newseviday_pipeline/ai.py', 'pipeline/src/newseviday_pipeline/ai_models.py', 'pipeline/src/newseviday_pipeline/budget.py', 'config/terminology.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ai-cache-${{ runner.os }}-${{ env.DEEPSEEK_MODEL }}-${{ hashFiles('pipeline/src/newseviday_pipeline/ai.py', 'pipeline/src/newseviday_pipeline/ai_models.py', 'pipeline/src/newseviday_pipeline/budget.py', 'config/terminology.yaml') }}-
      - name: Collect a fresh cutoff corpus
        if: env.RUN_BRIEF == 'true'
        run: >-
          python -m uv run --project pipeline newseviday-pipeline run
          --allow-network --output data/runtime/weekly-refresh
      - name: Merge the rolling public inventory
        if: env.RUN_BRIEF == 'true'
        run: |
          python -m uv run --project pipeline newseviday-pipeline merge-inventory \
            data/runtime/weekly-refresh/current.json \
            --accepted-snapshot apps/web/public/data/current.json \
            --output data/runtime/weekly-rolling
          echo "WEEKLY_INPUT=data/runtime/weekly-rolling/current.json" >> "$GITHUB_ENV"
      - name: Enrich fresh high-value articles
        if: env.RUN_BRIEF == 'true' && env.ALLOW_MODEL == 'true'
        run: |
          test -n "$DEEPSEEK_API_KEY"
          test -n "$DEEPSEEK_MODEL"
          enrich_args=(
            data/runtime/weekly-rolling/current.json
            --accepted-snapshot apps/web/public/data/current.json
            --output data/runtime/weekly-enriched
            --cache data/runtime/ai-cache
            --usage-report data/runtime/quality/weekly-ai-usage.json
            --allow-model
            --max-model-calls "$MODEL_CALL_LIMIT"
          )
          if [[ "$USE_ROLLOVER" == "true" ]]; then
            enrich_args+=(
              --base-model-calls "$BASE_MODEL_CALL_LIMIT"
              --rollover-ledger data/runtime/ai-budget/translation-rollover.json
              --rollover-cap "$DAILY_REFRESH_ROLLOVER_CAP"
              --rollover-seed "$DAILY_REFRESH_ROLLOVER_SEED"
            )
          fi
          python -m uv run --project pipeline newseviday-pipeline enrich "${enrich_args[@]}"
          echo "WEEKLY_INPUT=data/runtime/weekly-enriched/current.json" >> "$GITHUB_ENV"
      - name: Build weekly brief candidate from the fresh corpus
        if: env.RUN_BRIEF == 'true'
        shell: bash
        run: |
          brief_args=(
            "$WEEKLY_INPUT"
            --accepted-snapshot apps/web/public/data/current.json
            --output data/runtime/weekly-brief
            --cache data/runtime/ai-cache
            --usage-report data/runtime/quality/weekly-brief-ai-usage.json
          )
          if [[ "$ALLOW_MODEL" == "true" ]]; then
            test -n "$DEEPSEEK_API_KEY"
            test -n "$DEEPSEEK_MODEL"
            brief_args+=(--allow-model)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_generate }}" == "true" ]]; then
            brief_args+=(--force-generate)
          fi
          python -m uv run --project pipeline newseviday-pipeline update-brief "${brief_args[@]}"
          python -m uv run --project pipeline newseviday-pipeline validate-snapshot \
            data/runtime/weekly-brief/current.json
          python -m uv run --project pipeline newseviday-pipeline build-index \
            data/runtime/weekly-brief/current.json \
            --output data/runtime/rag/index.json \
            --vectorize-output data/runtime/rag/vectorize.ndjson
          python -m uv run --project pipeline newseviday-pipeline audit-snapshot \
            data/runtime/weekly-brief/current.json \
            --report data/runtime/quality/latest.json
          python -m uv run --project pipeline newseviday-pipeline eval-key-signal \
            pipeline/eval/key-signal-gold-v1.json \
            --report data/runtime/quality/key-signal-eval.json
          if python -m uv run --project pipeline newseviday-pipeline compare-quality \
            data/runtime/weekly-brief/current.json \
            --accepted-snapshot apps/web/public/data/current.json \
            --report data/runtime/quality/release-guard.json; then
            echo "RELEASE_ELIGIBLE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_ELIGIBLE=false" >> "$GITHUB_ENV"
            echo "::warning::Weekly candidate failed the comparative release guard; artifacts are retained and no pull request will be opened."
          fi
      - name: Summarize weekly AI usage
        if: always() && env.RUN_BRIEF == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def read_report(path: str) -> dict[str, object]:
              report = Path(path)
              if not report.exists():
                  return {}
              value = json.loads(report.read_text(encoding="utf-8"))
              return value if isinstance(value, dict) else {}

          article = read_report("data/runtime/quality/weekly-ai-usage.json")
          brief = read_report("data/runtime/quality/weekly-brief-ai-usage.json")
          lines = [
              "## Weekly AI usage",
              "",
              "| Capability | Requests | Tokens | Estimated cost (CNY) |",
              "| --- | ---: | ---: | ---: |",
              (
                  f"| Article enrichment | {article.get('modelCalls', 0)} | "
                  f"{article.get('totalTokens', 0)} | "
                  f"{article.get('estimatedCostCny', 'unavailable')} |"
              ),
              (
                  f"| Weekly brief | {brief.get('modelRequests', 0)} | "
                  f"{brief.get('totalTokens', 0)} | "
                  f"{brief.get('estimatedCostCny', 'unavailable')} |"
              ),
              "",
              f"Weekly brief status: `{brief.get('status', 'unavailable')}`.",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY
      - name: Publish verified weekly snapshot into the web workspace
        if: env.RUN_BRIEF == 'true' && env.RELEASE_ELIGIBLE == 'true'
        run: |
          python -m uv run --project pipeline newseviday-pipeline publish-web \
            data/runtime/weekly-brief/current.json \
            --web-data apps/web/public/data \
            --quality-report data/runtime/quality/latest.json
      - name: Verify publish candidate
        if: env.RUN_BRIEF == 'true' && env.RELEASE_ELIGIBLE == 'true'
        run: |
          npm ci
          npm run security:scan
          python -m uv run --project pipeline pytest pipeline/tests
          npm run test --workspace @newseviday/web
          npm run build --workspace @newseviday/web
      - name: Upload review artifacts
        if: always() && env.RUN_BRIEF == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: weekly-brief-${{ github.run_id }}
          path: |
            data/runtime/weekly-refresh/
            data/runtime/weekly-rolling/
            data/runtime/weekly-enriched/
            data/runtime/weekly-brief/
            data/runtime/ai-cache/
            data/runtime/ai-budget/
            data/runtime/quality/
            data/runtime/rag/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit and optionally publish weekly snapshot
        if: env.RUN_BRIEF == 'true' && env.RELEASE_ELIGIBLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add apps/web/public/data
          if git diff --cached --quiet; then
            echo "No weekly brief changes to publish."
            exit 0
          fi
          while IFS= read -r pr_number; do
            [[ -n "$pr_number" ]] || continue
            gh pr close "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --delete-branch \
              --comment "被本次使用最新截止语料生成的周报候选替代。旧候选仍保留在 Actions artifact 中。"
          done < <(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("content-refresh/weekly-brief-")) | .number')
          branch="content-refresh/weekly-brief-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "content: refresh weekly snapshot and trend brief"
          git push origin "$branch"
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "content: refresh weekly snapshot and trend brief" \
            --body "Fresh source collection plus an evidence-bound weekly brief, validated against the public release gate. Scheduled runs may publish automatically when the repository switch is enabled; manual runs remain review-only.")"
          echo "$pr_url"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$WEEKLY_REFRESH_AUTO_MERGE" == "true" ]]; then
            gh pr merge "$pr_url" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --delete-branch
            printf '## Automatic publication\n\nValidated scheduled weekly snapshot merged: %s\n' \
              "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Review required\n\nWeekly candidate: %s\n' \
              "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          fi
