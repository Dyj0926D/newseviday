name: Controlled content refresh

on:
  schedule:
    # Primary: 09:17 Asia/Shanghai. Recovery attempts: 11:47, 15:17 and 19:47.
    # Any successful same-day artifact makes later runs exit before checkout or
    # model calls, so the extra schedules improve delivery without repeating paid AI.
    - cron: '17 1 * * *'
    - cron: '47 3 * * *'
    - cron: '17 7 * * *'
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      allow_model:
        description: 'Run paid DeepSeek enrichment for uncached articles'
        required: true
        type: boolean
        default: false
      open_pull_request:
        description: 'Publish the validated snapshot through a reviewable pull request'
        required: true
        type: boolean
        default: false
      max_model_calls:
        description: 'Hard cap for paid enrichment calls in this run'
        required: true
        type: choice
        default: '5'
        options:
          - '1'
          - '3'
          - '5'
          - '10'

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_THINKING_ENABLED: ${{ vars.DEEPSEEK_THINKING_ENABLED || 'false' }}
      DEEPSEEK_INPUT_CNY_PER_MILLION: ${{ vars.DEEPSEEK_INPUT_CNY_PER_MILLION || '4' }}
      DEEPSEEK_OUTPUT_CNY_PER_MILLION: ${{ vars.DEEPSEEK_OUTPUT_CNY_PER_MILLION || '12' }}
      DAILY_REFRESH_ENABLED: ${{ vars.DAILY_REFRESH_ENABLED || 'false' }}
      DAILY_REFRESH_ALLOW_MODEL: ${{ vars.DAILY_REFRESH_ALLOW_MODEL || 'false' }}
      DAILY_REFRESH_MAX_MODEL_CALLS: ${{ vars.DAILY_REFRESH_MAX_MODEL_CALLS || '5' }}
      DAILY_REFRESH_MAX_MODEL_CALLS_PER_RUN: ${{ vars.DAILY_REFRESH_MAX_MODEL_CALLS_PER_RUN || '10' }}
      DAILY_REFRESH_ROLLOVER_CAP: ${{ vars.DAILY_REFRESH_ROLLOVER_CAP || '10' }}
      DAILY_REFRESH_ROLLOVER_SEED: ${{ vars.DAILY_REFRESH_ROLLOVER_SEED || '0' }}
      DAILY_REFRESH_OPEN_PULL_REQUEST: ${{ vars.DAILY_REFRESH_OPEN_PULL_REQUEST || 'true' }}
      DAILY_REFRESH_AUTO_MERGE: ${{ vars.DAILY_REFRESH_AUTO_MERGE || 'false' }}
      DAILY_REFRESH_END_DATE: ${{ vars.DAILY_REFRESH_END_DATE || '' }}
    steps:
      - name: Resolve refresh policy
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            if [[ "$DAILY_REFRESH_ENABLED" != "true" ]]; then
              echo "RUN_REFRESH=false" >> "$GITHUB_ENV"
              echo "Scheduled refresh is paused by DAILY_REFRESH_ENABLED."
              exit 0
            fi
            if [[ -n "$DAILY_REFRESH_END_DATE" && "$(TZ=Asia/Shanghai date +%F)" > "$DAILY_REFRESH_END_DATE" ]]; then
              echo "::error title=Content refresh expired::DAILY_REFRESH_ENABLED is true, but DAILY_REFRESH_END_DATE ended on $DAILY_REFRESH_END_DATE. Extend the window or disable the schedule explicitly."
              printf '## Controlled content refresh\n\n**Configuration error:** refresh is enabled, but the controlled window ended on `%s`.\n' \
                "$DAILY_REFRESH_END_DATE" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [[ "$(TZ=Asia/Shanghai date +%u)" == "6" ]]; then
              echo "RUN_REFRESH=false" >> "$GITHUB_ENV"
              echo "::notice title=Weekly refresh handoff::Saturday collection is owned by the weekly snapshot workflow."
              printf '## Controlled content refresh\n\nPlanned skip: Saturday collection is handled by the weekly snapshot workflow.\n' \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "RUN_REFRESH=true" >> "$GITHUB_ENV"
            echo "ALLOW_MODEL=$DAILY_REFRESH_ALLOW_MODEL" >> "$GITHUB_ENV"
            echo "BASE_MODEL_CALL_LIMIT=$DAILY_REFRESH_MAX_MODEL_CALLS" >> "$GITHUB_ENV"
            echo "MODEL_CALL_LIMIT=$DAILY_REFRESH_MAX_MODEL_CALLS_PER_RUN" >> "$GITHUB_ENV"
            echo "USE_ROLLOVER=true" >> "$GITHUB_ENV"
            echo "OPEN_PULL_REQUEST=$DAILY_REFRESH_OPEN_PULL_REQUEST" >> "$GITHUB_ENV"
          else
            echo "RUN_REFRESH=true" >> "$GITHUB_ENV"
            echo "ALLOW_MODEL=${{ inputs.allow_model }}" >> "$GITHUB_ENV"
            echo "MODEL_CALL_LIMIT=${{ inputs.max_model_calls }}" >> "$GITHUB_ENV"
            echo "BASE_MODEL_CALL_LIMIT=${{ inputs.max_model_calls }}" >> "$GITHUB_ENV"
            echo "USE_ROLLOVER=false" >> "$GITHUB_ENV"
            echo "OPEN_PULL_REQUEST=${{ inputs.open_pull_request }}" >> "$GITHUB_ENV"
          fi
      - name: Retire stale content pull requests and avoid same-day overlap
        if: env.RUN_REFRESH == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        shell: bash
        run: |
          local_today="$(TZ=Asia/Shanghai date +%F)"
          same_day_pr=""
          while IFS=$'\t' read -r pr_number head_ref created_at; do
            [[ -n "$pr_number" ]] || continue
            pr_local_day="$(TZ=Asia/Shanghai date -d "$created_at" +%F)"
            if [[ "$pr_local_day" == "$local_today" ]]; then
              same_day_pr="$pr_number"
              continue
            fi
            gh pr close "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --delete-branch \
              --comment "被 ${local_today} 的新一轮内容候选替代。旧候选产物仍保留在对应 Actions artifact 中。"
            echo "Retired stale content PR #${pr_number} from ${pr_local_day}."
          done < <(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,headRefName,createdAt \
            --jq '.[] | select(.headRefName | startswith("content-refresh/daily-")) | [.number, .headRefName, .createdAt] | @tsv')
          if [[ -n "$same_day_pr" ]]; then
            echo "RUN_REFRESH=false" >> "$GITHUB_ENV"
            echo "Scheduled refresh skipped because today's content PR #${same_day_pr} is still open."
            printf '## Controlled content refresh\n\nSkipped: same-day content PR #%s is still open.\n' \
              "$same_day_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$SCHEDULE_EXPRESSION" != "17 1 * * *" ]]; then
            successful_run_today=""
            while IFS=$'\t' read -r candidate_run_id candidate_created_at; do
              candidate_local_day="$(TZ=Asia/Shanghai date -d "$candidate_created_at" +%F)"
              [[ "$candidate_local_day" == "$local_today" ]] || continue
              artifact_count="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts" \
                --jq '[.artifacts[] | select((.expired | not) and (.name | startswith("content-refresh-")))] | length')"
              if [[ "$artifact_count" -gt 0 ]]; then
                successful_run_today="$candidate_run_id"
                break
              fi
            done < <(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow content-refresh.yml \
              --status success \
              --limit 20 \
              --json databaseId,createdAt \
              --jq '.[] | [.databaseId, .createdAt] | @tsv')
            if [[ -n "$successful_run_today" ]]; then
              echo "RUN_REFRESH=false" >> "$GITHUB_ENV"
              echo "Backup refresh skipped because successful content run ${successful_run_today} already completed today."
            fi
          fi
      - uses: actions/checkout@v7
        if: env.RUN_REFRESH == 'true'
      - uses: actions/setup-python@v7
        if: env.RUN_REFRESH == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        if: env.RUN_REFRESH == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - if: env.RUN_REFRESH == 'true'
        run: python -m pip install uv
      - if: env.RUN_REFRESH == 'true'
        run: python -m uv sync --project pipeline --frozen
      - name: Restore cumulative AI cache
        if: env.RUN_REFRESH == 'true'
        uses: actions/cache@v5
        with:
          path: |
            data/runtime/ai-cache
            data/runtime/ai-budget
          key: ai-cache-${{ runner.os }}-${{ env.DEEPSEEK_MODEL }}-${{ hashFiles('pipeline/src/newseviday_pipeline/ai.py', 'pipeline/src/newseviday_pipeline/ai_models.py', 'pipeline/src/newseviday_pipeline/budget.py', 'config/terminology.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ai-cache-${{ runner.os }}-${{ env.DEEPSEEK_MODEL }}-${{ hashFiles('pipeline/src/newseviday_pipeline/ai.py', 'pipeline/src/newseviday_pipeline/ai_models.py', 'pipeline/src/newseviday_pipeline/budget.py', 'config/terminology.yaml') }}-
      - name: Restore cache from previous successful trial artifact
        if: env.RUN_REFRESH == 'true' && env.ALLOW_MODEL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          previous_run_id=""
          previous_artifact_name=""
          while IFS= read -r candidate_run_id; do
            [[ -n "$candidate_run_id" ]] || continue
            paid_artifact="content-refresh-${candidate_run_id}-true"
            legacy_artifact="content-refresh-${candidate_run_id}"
            artifact_name="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts" \
              | jq -r --arg paid "$paid_artifact" --arg legacy "$legacy_artifact" \
                '[.artifacts[] | select((.name == $paid or .name == $legacy) and (.expired | not)) | .name]
                 | if index($paid) then $paid else .[0] // empty end')"
            if [[ -n "$artifact_name" ]]; then
              previous_run_id="$candidate_run_id"
              previous_artifact_name="$artifact_name"
              break
            fi
          done < <(gh run list \
            --workflow content-refresh.yml \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId')
          if [ -n "$previous_run_id" ]; then
            mkdir -p data/runtime/previous-artifact data/runtime/ai-cache data/runtime/ai-budget
            if gh run download "$previous_run_id" \
              --name "$previous_artifact_name" \
              --dir data/runtime/previous-artifact; then
              if [ -d data/runtime/previous-artifact/ai-cache ]; then
                cp -R data/runtime/previous-artifact/ai-cache/. data/runtime/ai-cache/
              fi
              if [ -d data/runtime/previous-artifact/ai-budget ] && \
                [ ! -f data/runtime/ai-budget/translation-rollover.json ]; then
                cp -R data/runtime/previous-artifact/ai-budget/. data/runtime/ai-budget/
              fi
            else
              echo "::warning::Previous AI cache artifact could not be downloaded; continuing with the Actions cache only."
            fi
          else
            echo "No non-expired paid refresh artifact was found; continuing with the Actions cache only."
          fi
      - name: Collect configured public sources
        if: env.RUN_REFRESH == 'true'
        run: >-
          python -m uv run --project pipeline newseviday-pipeline run
          --allow-network --output data/runtime/content-refresh
      - name: Select deterministic snapshot
        if: env.RUN_REFRESH == 'true'
        run: |
          python -m uv run --project pipeline newseviday-pipeline merge-inventory \
            data/runtime/content-refresh/current.json \
            --accepted-snapshot apps/web/public/data/current.json \
            --output data/runtime/content-rolling
          echo "PUBLISH_SNAPSHOT=data/runtime/content-rolling/current.json" >> "$GITHUB_ENV"
      - name: Optional paid AI enrichment
        if: env.RUN_REFRESH == 'true' && env.ALLOW_MODEL == 'true'
        run: |
          test -n "$DEEPSEEK_API_KEY"
          test -n "$DEEPSEEK_MODEL"
          enrich_args=(
            data/runtime/content-rolling/current.json
            --accepted-snapshot apps/web/public/data/current.json
            --output data/runtime/content-enriched
            --cache data/runtime/ai-cache
            --usage-report data/runtime/quality/ai-usage-latest.json
            --allow-model
            --max-model-calls "$MODEL_CALL_LIMIT"
          )
          if [[ "$USE_ROLLOVER" == "true" ]]; then
            enrich_args+=(
              --base-model-calls "$BASE_MODEL_CALL_LIMIT"
              --rollover-ledger data/runtime/ai-budget/translation-rollover.json
              --rollover-cap "$DAILY_REFRESH_ROLLOVER_CAP"
              --rollover-seed "$DAILY_REFRESH_ROLLOVER_SEED"
            )
          fi
          python -m uv run --project pipeline newseviday-pipeline enrich "${enrich_args[@]}"
          echo "PUBLISH_SNAPSHOT=data/runtime/content-enriched/current.json" >> "$GITHUB_ENV"
      - name: Preserve the latest successful weekly brief
        if: env.RUN_REFRESH == 'true'
        run: |
          python -m uv run --project pipeline newseviday-pipeline update-brief \
            "$PUBLISH_SNAPSHOT" \
            --accepted-snapshot apps/web/public/data/current.json \
            --output data/runtime/content-briefed \
            --cache data/runtime/ai-cache
          echo "PUBLISH_SNAPSHOT=data/runtime/content-briefed/current.json" >> "$GITHUB_ENV"
      - name: Validate and build retrieval artifacts
        if: env.RUN_REFRESH == 'true'
        run: |
          python -m uv run --project pipeline newseviday-pipeline validate-snapshot "$PUBLISH_SNAPSHOT"
          python -m uv run --project pipeline newseviday-pipeline build-index \
            "$PUBLISH_SNAPSHOT" \
            --output data/runtime/rag/index.json \
            --vectorize-output data/runtime/rag/vectorize.ndjson
          python -m uv run --project pipeline newseviday-pipeline audit-snapshot \
            "$PUBLISH_SNAPSHOT" \
            --report data/runtime/quality/latest.json
          python -m uv run --project pipeline newseviday-pipeline eval-key-signal \
            pipeline/eval/key-signal-gold-v1.json \
            --report data/runtime/quality/key-signal-eval.json
          if python -m uv run --project pipeline newseviday-pipeline compare-quality \
            "$PUBLISH_SNAPSHOT" \
            --accepted-snapshot apps/web/public/data/current.json \
            --report data/runtime/quality/release-guard.json; then
            echo "RELEASE_ELIGIBLE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_ELIGIBLE=false" >> "$GITHUB_ENV"
            echo "::warning::Candidate failed the comparative release guard; artifacts are retained and no pull request will be opened."
          fi
      - name: Write controlled refresh summary
        if: env.RUN_REFRESH == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          quality_path = Path("data/runtime/quality/latest.json")
          guard_path = Path("data/runtime/quality/release-guard.json")
          signal_eval_path = Path("data/runtime/quality/key-signal-eval.json")
          usage_path = Path("data/runtime/quality/ai-usage-latest.json")
          run_paths = sorted(Path("data/runtime/content-refresh/runs").glob("*.json"))
          lines = ["## Controlled content refresh", "", "| Item | Value |", "| --- | ---: |"]
          if run_paths:
              pipeline_run = json.loads(run_paths[-1].read_text(encoding="utf-8"))
              outcomes = pipeline_run.get("sourceOutcomes", [])
              failed_sources = [
                  item["sourceId"] for item in outcomes if item.get("fetchStatus") == "failed"
              ]
              zero_selected = [
                  item["sourceId"]
                  for item in outcomes
                  if item.get("parseStatus") == "succeeded" and item.get("selectedCount") == 0
              ]
              lines.extend(
                  [
                      f"| Failed sources | {', '.join(failed_sources) or 'none'} |",
                      f"| Parsed but not selected | {', '.join(zero_selected) or 'none'} |",
                  ]
              )
          if quality_path.exists():
              quality = json.loads(quality_path.read_text(encoding="utf-8"))
              lines.extend(
                  [
                      f"| Snapshot | `{quality['snapshotId']}` |",
                      f"| Articles | {quality['articleCount']} |",
                      f"| Contributing sources | {quality['contributingSourceCount']} |",
                      f"| Missing abstracts | {quality['missingAbstractCount']} |",
                      f"| Topic gaps | {len(quality['topicGaps'])} |",
                      f"| Chinese-visible topic gaps | {len(quality.get('visibleTopicGaps', []))} |",
                      f"| Eligible Key Signals | {quality.get('keySignalEligibleCount', 0)} |",
                      f"| High-significance events | {quality.get('highSignificanceEventCount', 0)} |",
                      f"| High-significance Chinese gaps | {quality.get('highSignificanceChineseGapCount', 0)} |",
                      f"| Visible in last 24h | {quality.get('visibleRecent24hCount', 0)} |",
                      f"| Visible in last 48h | {quality.get('visibleRecent48hCount', 0)} |",
                      f"| Quality gate | {quality['gate']} |",
                  ]
              )
          if guard_path.exists():
              guard = json.loads(guard_path.read_text(encoding="utf-8"))
              lines.extend(
                  [
                      f"| Release guard | {guard['gate']} |",
                      f"| Recent Chinese-ready | {guard['candidateRecentChineseReadyCount']} / {guard['candidateRecentArticleCount']} |",
                      f"| Required Chinese-ready | {guard['requiredRecentChineseReadyCount']} |",
                      f"| Release issues | {'; '.join(guard['issues']) or 'none'} |",
                      f"| Release warnings | {'; '.join(guard.get('warnings', [])) or 'none'} |",
                      f"| New article IDs | {guard.get('newArticleCount', 0)} |",
                  ]
              )
          if signal_eval_path.exists():
              signal_eval = json.loads(signal_eval_path.read_text(encoding="utf-8"))
              lines.extend(
                  [
                      f"| Key Signal Eval gate | {signal_eval['gate']} |",
                      f"| Key Signal eligibility F1 | {signal_eval['eligibility']['f1']} |",
                      f"| Event type exact accuracy | {signal_eval['eventTypeExactAccuracy']} |",
                  ]
              )
          if usage_path.exists():
              usage = json.loads(usage_path.read_text(encoding="utf-8"))
              cost = usage.get("estimatedCostCny")
              lines.extend(
                  [
                      f"| Model calls | {usage['modelCalls']} / {usage['modelCallLimit']} |",
                      f"| Base daily calls | {usage.get('baseModelCallLimit', 'n/a')} |",
                      f"| Rollover balance | {usage.get('rolloverBefore', 'n/a')} → {usage.get('rolloverAfter', 'n/a')} |",
                      f"| Supplemental translation calls | {usage.get('supplementalTranslationCalls', 0)} |",
                      f"| Priority-topic translation calls | {usage.get('priorityTopicTranslationCalls', 0)} |",
                      f"| Published AI reused | {usage.get('acceptedEnrichmentReuses', 0)} |",
                      f"| Cache hits | {usage['cacheHits']} |",
                      f"| Skipped below quality floor | {usage.get('skippedBelowQualityFloor', 0)} |",
                      f"| Skipped stale | {usage.get('skippedStale', 0)} |",
                      f"| Skipped by source cap | {usage.get('skippedSourceCap', 0)} |",
                      f"| Total tokens | {usage['totalTokens']} |",
                      f"| Estimated cost (CNY) | {cost if cost is not None else 'unavailable'} |",
                      f"| Usage complete | {usage['usageComplete']} |",
                  ]
              )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY
      - name: Run compatible RAG evaluation
        if: env.RUN_REFRESH == 'true'
        run: |
          dataset="pipeline/eval/rag-gold-trial-v3.json"
          if [[ -f "$dataset" ]]; then
            expected_snapshot="$(jq -r '.corpusSnapshotId' "$dataset")"
            current_snapshot="$(jq -r '.snapshotId' "$PUBLISH_SNAPSHOT")"
            if [[ "$expected_snapshot" == "$current_snapshot" ]]; then
              python -m uv run --project pipeline newseviday-pipeline eval-rag \
                "$PUBLISH_SNAPSHOT" \
                "$dataset" \
                --report data/runtime/rag/eval-latest.json
            else
              echo "Pinned eval corpus $expected_snapshot does not match $current_snapshot; keeping the last comparable report."
            fi
          fi
      - name: Publish into web workspace
        if: env.RUN_REFRESH == 'true' && env.OPEN_PULL_REQUEST == 'true' && env.RELEASE_ELIGIBLE == 'true'
        run: |
          publish_args=("$PUBLISH_SNAPSHOT" --web-data apps/web/public/data)
          if [[ -f data/runtime/rag/eval-latest.json ]]; then
            publish_args+=(--eval-report data/runtime/rag/eval-latest.json)
          fi
          if [[ -f data/runtime/quality/latest.json ]]; then
            publish_args+=(--quality-report data/runtime/quality/latest.json)
          fi
          python -m uv run --project pipeline newseviday-pipeline publish-web "${publish_args[@]}"
      - name: Verify publish candidate
        if: env.RUN_REFRESH == 'true' && env.OPEN_PULL_REQUEST == 'true' && env.RELEASE_ELIGIBLE == 'true'
        run: |
          npm ci
          npm run security:scan
          python -m uv run --project pipeline pytest pipeline/tests
          npm run test --workspace @newseviday/web
          npm run build --workspace @newseviday/web
      - name: Upload review artifacts
        if: always() && env.RUN_REFRESH == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: content-refresh-${{ github.run_id }}-${{ env.ALLOW_MODEL }}
          path: |
            data/runtime/content-refresh/
            data/runtime/content-rolling/
            data/runtime/content-enriched/
            data/runtime/content-briefed/
            data/runtime/ai-cache/
            data/runtime/ai-budget/
            data/runtime/rag/
            data/runtime/quality/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit snapshot candidate
        if: env.RUN_REFRESH == 'true' && env.OPEN_PULL_REQUEST == 'true' && env.RELEASE_ELIGIBLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="content-refresh/daily-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add apps/web/public/data
          if git diff --cached --quiet; then
            echo "PUBLISH_HAS_CHANGES=false" >> "$GITHUB_ENV"
            echo "No public snapshot changes to publish."
            exit 0
          fi
          git commit -m "content: refresh public snapshot"
          git push origin "$branch"
          echo "PUBLISH_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "PUBLISH_HAS_CHANGES=true" >> "$GITHUB_ENV"
      - name: Open and optionally publish snapshot pull request
        if: env.RUN_REFRESH == 'true' && env.OPEN_PULL_REQUEST == 'true' && env.RELEASE_ELIGIBLE == 'true' && env.PUBLISH_HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url="$(gh pr create \
            --base main \
            --head "$PUBLISH_BRANCH" \
            --title "content: refresh public snapshot" \
            --body "Controlled refresh run ${GITHUB_RUN_ID}. The candidate has passed collection, quality, security, web test and build gates. Scheduled runs may publish automatically when the repository switch is enabled; manual runs remain review-only.")"
          echo "$pr_url"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$DAILY_REFRESH_AUTO_MERGE" == "true" ]]; then
            gh pr merge "$pr_url" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --delete-branch
            printf '## Automatic publication\n\nValidated scheduled snapshot merged: %s\n' \
              "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Review required\n\nSnapshot candidate: %s\n' \
              "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          fi
