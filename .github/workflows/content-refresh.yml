name: Manual content refresh

on:
  workflow_dispatch:
    inputs:
      allow_model:
        description: 'Run paid DeepSeek enrichment for uncached articles'
        required: true
        type: boolean
        default: false
      open_pull_request:
        description: 'Publish the validated snapshot through a reviewable pull request'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_THINKING_ENABLED: ${{ vars.DEEPSEEK_THINKING_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: python -m pip install uv
      - run: python -m uv sync --project pipeline --frozen
      - name: Collect configured public sources
        run: >-
          python -m uv run --project pipeline newseviday-pipeline run
          --allow-network --output data/runtime/content-refresh
      - name: Select deterministic snapshot
        run: echo "PUBLISH_SNAPSHOT=data/runtime/content-refresh/current.json" >> "$GITHUB_ENV"
      - name: Optional paid AI enrichment
        if: ${{ inputs.allow_model }}
        run: |
          test -n "$DEEPSEEK_API_KEY"
          test -n "$DEEPSEEK_MODEL"
          python -m uv run --project pipeline newseviday-pipeline enrich \
            data/runtime/content-refresh/current.json \
            --output data/runtime/content-enriched \
            --cache data/runtime/ai-cache \
            --allow-model
          echo "PUBLISH_SNAPSHOT=data/runtime/content-enriched/current.json" >> "$GITHUB_ENV"
      - name: Validate and build retrieval artifacts
        run: |
          python -m uv run --project pipeline newseviday-pipeline validate-snapshot "$PUBLISH_SNAPSHOT"
          python -m uv run --project pipeline newseviday-pipeline build-index \
            "$PUBLISH_SNAPSHOT" \
            --output data/runtime/rag/index.json \
            --vectorize-output data/runtime/rag/vectorize.ndjson
      - name: Publish into web workspace
        if: ${{ inputs.open_pull_request }}
        run: >-
          python -m uv run --project pipeline newseviday-pipeline publish-web
          "$PUBLISH_SNAPSHOT" --web-data apps/web/public/data
      - name: Verify publish candidate
        if: ${{ inputs.open_pull_request }}
        run: |
          npm ci
          npm run security:scan
          npm run test --workspace @newseviday/web
          npm run build --workspace @newseviday/web
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: content-refresh-${{ github.run_id }}
          path: |
            data/runtime/content-refresh/
            data/runtime/content-enriched/
            data/runtime/rag/
          if-no-files-found: error
          retention-days: 14
      - name: Open snapshot pull request
        if: ${{ inputs.open_pull_request }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="content-refresh/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add apps/web/public/data/current.json
          git commit -m "content: refresh public snapshot"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "content: refresh public snapshot" \
            --body "Manual refresh run ${GITHUB_RUN_ID}. Review source quality and diff before merging."
