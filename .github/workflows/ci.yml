name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm run audit:prod
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @newseviday/web

  python-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: python -m uv sync --project pipeline --frozen
      - run: python -m uv run --project pipeline ruff check pipeline
      - run: python -m uv run --project pipeline mypy pipeline/src
      - run: python -m uv run --project pipeline pytest pipeline/tests
