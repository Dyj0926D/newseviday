[project]
name = "newseviday-pipeline"
version = "0.1.0"
description = "NewsEviday deterministic content and evaluation pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "defusedxml>=0.7,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
]

[project.scripts]
newseviday-pipeline = "newseviday_pipeline.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0,<7",
  "types-defusedxml>=0.7,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newseviday_pipeline"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["newseviday_pipeline"]
mypy_path = "src"
